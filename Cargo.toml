[workspace]
members = ["crates/*"]
# `cargo build/test/clippy` at the root cover every crate, not just the bin.
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tracker-core = { path = "crates/tracker-core" }
tracker-platform = { path = "crates/tracker-platform" }
tracker-gui-win32 = { path = "crates/tracker-gui-win32" }
tracker-gui-gpui = { path = "crates/tracker-gui-gpui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winreg = "0.55"
tempfile = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemInformation",
] }

[package]
name = "activity-tracker-win-rs"
version.workspace = true
edition.workspace = true

[features]
default = ["gui-gpui", "gui-win32"]
# GPU-rendered GUI (GPUI): the default frontend.
gui-gpui = ["dep:tracker-gui-gpui"]
# Legacy GUI built on the standard Win32 controls: `--legacy-ui`, and the
# automatic fallback when GPUI cannot start.
gui-win32 = ["dep:tracker-gui-win32"]

[dependencies]
tracker-core.workspace = true
tracker-platform.workspace = true
tracker-gui-win32 = { workspace = true, optional = true }
tracker-gui-gpui = { workspace = true, optional = true }
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
winresource = "0.1"
